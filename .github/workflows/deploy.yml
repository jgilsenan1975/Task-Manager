name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AZURE_WEBAPP_NAME: task-manager-joe # <-- change to the App Service name you created
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Angular app
        working-directory: frontend
        run: |
          npm ci
          npx ng build --configuration production

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        working-directory: backend/TaskManager.Api
        run: |
          dotnet restore
          dotnet publish -c Release -o ${{ github.workspace }}/publish

      - name: Copy Angular build into published wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r frontend/dist/task-manager-client/browser/. publish/wwwroot/

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
